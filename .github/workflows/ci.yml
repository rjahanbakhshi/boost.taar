name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # C++20, the minimum: the oldest toolchains we support.
          - name: linux-gcc-13-cxx20
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            cppstd: 20

          - name: linux-clang-18-cxx20
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            apt: clang-18
            cppstd: 20

          - name: linux-clang-18-libcxx-cxx20
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            apt: clang-18 libc++-18-dev libc++abi-18-dev
            libcxx: libc++
            cppstd: 20

          - name: windows-msvc-2022-cxx20
            os: windows-2022
            conan_profile: profiles/windows-vs2022.profile
            cppstd: 20

          # Experimental until the macOS-only runtime failures are fixed.
          - name: macos-xcode-16.4-cxx20
            os: macos-15
            xcode: '16.4'
            cppstd: 20
            experimental: true

          # C++23: current mainstream toolchains.
          - name: linux-gcc-14-cxx23
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cppstd: 23

          - name: linux-clang-20-cxx23
            os: ubuntu-24.04
            cc: clang-20
            cxx: clang++-20
            apt: clang-20
            cppstd: 23

          - name: windows-msvc-2026-cxx23
            os: windows-2025
            conan_profile: profiles/windows-vs2026.profile
            cppstd: 23

          - name: macos-xcode-26.6-cxx23
            os: macos-26
            xcode: '26.6'
            cppstd: 23
            experimental: true

          # C++26: the newest toolchains, as an early warning.
          - name: linux-gcc-15-cxx26
            os: ubuntu-26.04
            cc: gcc-15
            cxx: g++-15
            cppstd: 26
            experimental: true

          - name: linux-clang-22-libcxx-cxx26
            os: ubuntu-26.04
            cc: clang-22
            cxx: clang++-22
            apt: clang-22 libc++-22-dev libc++abi-22-dev
            libcxx: libc++
            cppstd: 26
            experimental: true

          # Probes below the supported floor (GCC 13, Clang 18).
          - name: linux-gcc-12-cxx20
            os: ubuntu-24.04
            cc: gcc-12
            cxx: g++-12
            cppstd: 20
            experimental: true

          - name: linux-clang-17-cxx20
            os: ubuntu-24.04
            cc: clang-17
            cxx: clang++-17
            apt: clang-17
            cppstd: 20
            experimental: true

          # Sanitizers.
          - name: linux-gcc-14-asan-ubsan
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cppstd: 20
            sanitize: address,undefined

          # Experimental until its first clean run.
          - name: linux-clang-18-tsan
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            apt: clang-18
            cppstd: 20
            sanitize: thread
            experimental: true

    env:
      CMAKE_BUILD_TYPE: Release
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.0"
          conan --version

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.apt }}
          echo "CC=${{ matrix.cc }}"  >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          echo "CC=clang"    >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          clang++ --version

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ matrix.name }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ matrix.name }}-

      - name: Detect default Conan profile (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          conan profile detect --force
          echo "CONAN_HOST_PROFILE=default" >> "$GITHUB_ENV"

      # The flags go through Conan so they reach the toolchain file without
      # replacing the ones Conan sets (-stdlib=libc++ and the like), and
      # Boost is built instrumented too. TSan's shadow memory mapping fails
      # with the runners' default ASLR entropy, hence the sysctl.
      - name: Configure sanitizers
        if: matrix.sanitize
        run: |
          san='"-fsanitize=${{ matrix.sanitize }}"'
          cat > "$RUNNER_TEMP/sanitize.profile" <<EOF
          include(default)
          [conf]
          tools.build:cxxflags=[$san, "-fno-omit-frame-pointer", "-fno-sanitize-recover=all", "-g"]
          tools.build:exelinkflags=[$san]
          tools.build:sharedlinkflags=[$san]
          EOF
          cat "$RUNNER_TEMP/sanitize.profile"
          echo "CONAN_HOST_PROFILE=$RUNNER_TEMP/sanitize.profile" >> "$GITHUB_ENV"
          echo "UBSAN_OPTIONS=print_stacktrace=1" >> "$GITHUB_ENV"
          echo "TSAN_OPTIONS=halt_on_error=1 second_deadlock_stack=1" >> "$GITHUB_ENV"
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Conan install (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          conan install . -of=build \
            -pr:h="$CONAN_HOST_PROFILE" -pr:b=default \
            -s build_type=$CMAKE_BUILD_TYPE \
            -s compiler.cppstd=${{ matrix.cppstd }} \
            ${{ matrix.libcxx && format('-s compiler.libcxx={0}', matrix.libcxx) || '' }} \
            --build=missing

      - name: Conan install (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          conan install . -of=build ^
            -pr:h=${{ matrix.conan_profile }} ^
            -pr:b=${{ matrix.conan_profile }} ^
            -s build_type=%CMAKE_BUILD_TYPE% ^
            -s compiler.cppstd=${{ matrix.cppstd }} ^
            --build=missing

      - name: CMake configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --preset conan-release

      - name: CMake configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake --preset conan-release

      - name: Build
        run: cmake --build --preset conan-release -j

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Build examples
        run: cmake --build --preset conan-release -j --target examples
        shell: bash
